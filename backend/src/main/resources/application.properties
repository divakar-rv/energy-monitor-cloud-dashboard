# ---- LOCAL TESTING CONFIG (H2 in-memory database) ----
# This lets you run and test everything on your laptop with zero setup.
# Data resets every time you restart the app -- that's expected and fine
# for development.
spring.datasource.url=jdbc:h2:mem:energydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=divakar07#
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA creates/updates tables automatically from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

# ---- WHEN YOU DEPLOY (Render/Railway with real Postgres) ----
# Comment out the H2 lines above and uncomment these. Render/Railway
# give you a DATABASE_URL automatically -- read the deployment section
# of the README for exactly how to wire this up as environment variables
# instead of hardcoding real credentials here.
#
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
